name: Build installers

# Push to main  ->  builds Windows .exe, Linux .deb and Android .apk
#               ->  creates (or updates) the release "v<APP_VERSION>" with all of them.
# APP_VERSION lives near the top of arckad-d.py, for example  APP_VERSION = "3.7.0"
on:
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' arckad-d.py)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 with GTK 3 and Python
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip

      - name: Install PyInstaller and the QR-code library
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-pyinstaller || {
            pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc
            python -m pip install --break-system-packages pyinstaller
          }
          python -m pip install --break-system-packages qrcode

      - name: Build Arckad-D.exe
        shell: msys2 {0}
        run: pyinstaller --noconfirm --clean windows/arckad-d.spec

      - name: Self-test the built app
        shell: msys2 {0}
        run: |
          ./dist/Arckad-D/Arckad-D.exe --selftest selftest.txt || true
          cat selftest.txt
          grep -q "SELFTEST OK" selftest.txt

      - name: Make the installer and portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path arckad-d.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist\Arckad-D\* -DestinationPath "installer-output\Arckad-D-$version-portable-windows.zip"
          Get-ChildItem installer-output

      - uses: actions/upload-artifact@v4
        with:
          name: Arckad-D-Windows
          path: installer-output/*

  linux:
    name: Linux package (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install icon tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Build the .deb
        run: bash linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Arckad-D-Linux
          path: build/*.deb

  android:
    name: Android app (.apk)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          # versions that belong together (buildozer 1.5 + python-for-android 2024.01.21)
          python -m pip install "buildozer==1.5.0" "Cython==0.29.36" "setuptools<70" wheel
      - name: Use the version from arckad-d.py and the fixed signing key
        run: |
          sed -i 's/^__version__ = .*/__version__ = "${{ needs.version.outputs.version }}"/' android/main.py
          mkdir -p ~/.android
          cp android/signing/debug.keystore ~/.android/debug.keystore
      - name: Reuse downloaded Android tools from earlier builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
      - name: Build the APK (first time takes about 30 minutes)
        working-directory: android
        run: |
          set +e
          yes | buildozer android debug 2>&1 | tee build.log
          status=${PIPESTATUS[1]}          # buildozer's own result ("yes" always ends with a harmless broken pipe)
          ls -la bin/ || true
          exit $status
      - name: Show the Android build errors
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' android/build.log > clean.log
          echo "=== error lines ==="
          grep -n -E "ERROR:|Error:|error:|Command failed|No such file|not found" clean.log \
            | grep -v -E "performance hint|warning|Dependency for .* not resolved" | tail -n 40 || true
          echo "=== last lines before the settings list ==="
          grep -v -E '^#     ' clean.log | tail -n 80
      - name: Keep the full Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
      - name: Name the APK
        run: |
          mkdir -p apk-out
          cp android/bin/*.apk "apk-out/Arckad-D-${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Arckad-D-Android
          path: apk-out/*.apk

  release:
    name: Publish release
    needs: [version, windows, linux, android]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: List files
        run: ls -la release-files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Arckad-D ${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: release-files/*
