name: Build installers

# Push to main  ->  builds Windows .exe, Linux .deb and Android .apk
#               ->  creates (or updates) the release "v<APP_VERSION>" with all of them.
# APP_VERSION lives near the top of arckad-d.py, for example  APP_VERSION = "3.7.0"
on:
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' arckad-d.py)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make icons from branding/logo.png (if there is one)
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python branding/make-icons.py
      - name: Set up MSYS2 with GTK 3 and Python
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip

      - name: Install PyInstaller and the QR-code library
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-pyinstaller || {
            pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc
            python -m pip install --break-system-packages pyinstaller
          }
          python -m pip install --break-system-packages qrcode

      - name: Build Arckad-D.exe
        shell: msys2 {0}
        run: pyinstaller --noconfirm --clean windows/arckad-d.spec

      - name: Self-test the built app like a normal Windows PC would run it
        shell: pwsh
        run: |
          # Without the build tools on PATH, so a DLL missing from the app can't be borrowed from them.
          $env:PATH = "C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem"
          $p = Start-Process -FilePath "dist\Arckad-D\Arckad-D.exe" -ArgumentList "--selftest","selftest.txt" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "Self-test hung"; exit 1 }
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "No self-test output"; exit 1 }
          if (-not (Select-String -Path selftest.txt -Pattern "SELFTEST OK" -Quiet)) { exit 1 }

      - name: Make the installer and portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path arckad-d.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist\Arckad-D\* -DestinationPath "installer-output\Arckad-D-$version-portable-windows.zip"
          Get-ChildItem installer-output

      - name: Install it and test the installed copy like a normal Windows PC
        shell: pwsh
        run: |
          $version = (Select-String -Path arckad-d.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $dir = Join-Path $env:RUNNER_TEMP "ArckadInstalled"
          $setup = Start-Process -FilePath "installer-output\Arckad-D-Setup-$version.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOLAUNCH","/CURRENTUSER","/DIR=$dir" -PassThru
          if (-not $setup.WaitForExit(180000)) { Write-Host "Installer hung"; exit 1 }
          Write-Host "Installer exit code: $($setup.ExitCode)"
          if (-not (Test-Path "$dir\_internal\libpython3*.dll")) { Write-Host "Python DLL missing after install"; Get-ChildItem "$dir\_internal" | Select-Object -First 40; exit 1 }
          $env:PATH = "C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem"
          $out = Join-Path $env:RUNNER_TEMP "installed-selftest.txt"
          $p = Start-Process -FilePath "$dir\Arckad-D.exe" -ArgumentList "--selftest",$out -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "Installed app hung (probably an error box)"; exit 1 }
          if (Test-Path $out) { Get-Content $out } else { Write-Host "Installed app wrote no self-test output"; exit 1 }
          if (-not (Select-String -Path $out -Pattern "SELFTEST OK" -Quiet)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Arckad-D-Windows
          path: installer-output/*

  linux:
    name: Linux package (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install icon tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin python3-pil
      - name: Build the .deb
        run: bash linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Arckad-D-Linux
          path: build/*.deb

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make icons from branding/logo.png (if there is one)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 branding/make-icons.py
      - name: Build the APK (about a minute, native Android, no extra downloads)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Arckad-D-Android
          path: android/build/Arckad-D-*.apk

  release:
    name: Publish release
    needs: [version, windows, linux, android]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: List files
        run: ls -la release-files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Arckad-D ${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: release-files/*
